apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: v3.1.4
      helm:
        values: |
          admissionController:
            replicas: 3
          backgroundController:
            replicas: 2
          cleanupController:
            replicas: 2
          reportsController:
            replicas: 2
    - repoURL: https://github.com/jordann6/secure-software-factory
      targetRevision: HEAD
      path: platform/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
