apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-sbom-attestation
  annotations:
    policies.kyverno.io/title: Require SBOM Attestation
    policies.kyverno.io/description: >-
      Every image deployed to the demo namespace must have an SPDX SBOM
      attestation signed by the GitHub Actions OIDC identity for this repo.
      This ensures every workload has a verifiable software bill of materials.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-sbom-attestation
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - demo
      verifyImages:
        - imageReferences:
            - "*"
          attestations:
            - predicateType: https://spdx.dev/Document
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/jordann6/secure-software-factory/.github/workflows/build-sign-attest.yaml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
